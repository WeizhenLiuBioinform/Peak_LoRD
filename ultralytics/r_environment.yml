# R packages required by align.R (merged into the same conda env as Python):
#   conda env update -n <env_name> -f ultralytics/r_environment.yml
# Bioconductor packages (xcms, MSnbase, BiocParallel) are NOT available from
# conda channels on Windows (bioconda builds Linux/macOS only), so they are
# installed from inside R with BiocManager afterwards (see Readme.md step 5).
channels:
  - conda-forge
  - defaults
dependencies:
  - r-base
  - r-optparse
